<h3>Academic Progress Tracker</h3>

<!-- Top Card: Input Form -->
<div class="card shadow-sm mb-4 col-6">
  <div class="card-body">
    <form method="POST" action="{{ url_for('academic_progress', child_id=selected_child.id) }}" class="row g-3">
      <!-- Subject Row -->
      <div class="row">
        <div class="col-12">
            <label class="form-label mt-2 fw-bold">Subject</label>
            <select name="subject" class="form-select" required>
            <option value="">-- Select Subject --</option>
            {% for subject in subjects %}
                <option value="{{ subject }}">{{ subject }}</option>
            {% endfor %}
            </select>
        </div>
      </div>

      <!-- Score Row -->
       <div class="row">
            <div class="col-12">
                <label class="form-label mt-2 fw-bold">Score</label>
                <input type="number" name="score" class="form-control" min="0" max="100" required>
            </div>
      </div>

      <!-- Year + Month Row -->
       <div class="row">
        <div class="col-md-6">
            <label class="form-label mt-2 fw-bold">Year</label>
            <input type="number" name="year" id="yearInput" class="form-control" min="2000" max="2100" required readonly>
        </div>
        <div class="col-md-6">
            <label class="form-label mt-2 fw-bold">Month</label>
            <select name="month" class="form-select" required>
            <option value="">-- Select Month --</option>
            {% for m in range(1,13) %}
                <option value="{{m}}">{{m}}</option>
            {% endfor %}
            </select>
        </div>
       </div>

      <!-- Submit -->
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>

<!-- Bottom Card -->
<div class="card shadow-sm">
  <div class="card-body">
    {% if scores|length == 0 %}
      <p class="text-muted text-center">No academic records yet. Please input scores above.</p>
    {% else %}
      <div class="row">
        <!-- Bar Chart -->
        <div class="col-md-8">
          <h5>Average Scores by Subject</h5>
          <canvas id="averageChart" style="max-height: 400px;"></canvas>
        </div>

        <!-- Records Table -->
        <div class="col-md-4">
          <h5>All Records</h5>
          <div class="table-responsive" style="max-height:400px; overflow-y:auto;">
            <table class="table table-sm table-bordered">
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Date</th>
                  <th>Score</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody>
                {% for row in scores %}
                <tr>
                  <td>{{ row.subject }}</td>
                  <td>{{ row.date.strftime('%Y-%m') }}</td>
                  <td>{{ row.score }}</td>
                  <td class="text-center">
                    <form method="POST" action="{{ url_for('delete_academic', id=row.id, child_id=selected_child.id) }}" style="display:inline;">
                      <button type="submit" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                    </form>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Chart Script -->
      <script>
        new Chart(document.getElementById("averageChart"), {
          type: 'bar',
          data: {
            labels: {{ subjects|tojson }},
            datasets: [{
              label: "Average Score",
              data: [
                {% for subject in subjects %}
                  {{ subject_averages[subject] }}{{ "," if not loop.last else "" }}
                {% endfor %}
              ],
              backgroundColor: [
                'rgba(255, 99, 132, 0.7)',
                'rgba(54, 162, 235, 0.7)',
                'rgba(255, 206, 86, 0.7)',
                'rgba(75, 192, 192, 0.7)',
                'rgba(153, 102, 255, 0.7)',
                'rgba(255, 159, 64, 0.7)',
                'rgba(99, 255, 132, 0.7)'
              ],
              borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)',
                'rgba(255, 159, 64, 1)',
                'rgba(99, 255, 132, 1)'
              ],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                title: {
                  display: true,
                  text: "Average Score"
                }
              },
              x: {
                title: {
                  display: true,
                  text: "Subject"
                }
              }
            },
            plugins: {
              legend: {
                display: false
              }
            }
          }
        });
      </script>
    {% endif %}
  </div>
</div>

<script>
// Set current year automatically
document.addEventListener('DOMContentLoaded', function() {
  const yearInput = document.getElementById("yearInput");
  if (yearInput) {
    yearInput.value = new Date().getFullYear();
  }
});
</script>
